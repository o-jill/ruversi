<html>
<head>
 <title>rfen to obf converter</title>
<script type="text/javascript">
const FMT_NONE = 0;
const FMT_OBF = 1;
const FMT_RFEN = 2;
const FMT_SHORT_RFEN = 3;

function readrfen(rfen) {
    let board = new Array(64);
    let el = rfen.split(' ');
    let turn = el[1];
    let y = 0;
    for (const row of el[0].split('/')) {
        let x = 0;
        for (const ch of row) {
            let n = "12345678".indexOf(ch);
            if (n >= 0) {
                for (let _i = 0; _i <= n; ++_i) {
                    board[x + y * 8] = '-';
                    ++x;
                }
                continue;
            }
            let s = "ABCDEFGH".indexOf(ch);
            if (s >= 0) {
                for (let _i = 0; _i <= s; ++_i) {
                    board[x + y * 8] = 'X';
                    ++x;
                }
                continue;
            }
            let g = "abcdefgh".indexOf(ch);
            if (g >= 0) {
                for (let _i = 0; _i <= g; ++_i) {
                    board[x + y * 8] = 'O';
                    ++x;
                }
                continue;
            }
        }
        ++y;
    }
    if (turn == 'b') {
        return board.join('') + " X";
    } else {
        return board.join('') + " O";
    }
}

function readshortrfen(rfen) {
    let board = "";
    let el = rfen.split(' ');
    let turn = el[1];
    let index = 0;
    for (const ch of el[0]) {
        let n = "12345678".indexOf(ch);
        if (n >= 0) {
            for (let _i = 0; _i <= n; ++_i) {
                board += '-';
                ++index;
            }
            continue;
        }
        let s = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".indexOf(ch);
        if (s >= 0) {
            for (let _i = 0; _i <= s; ++_i) {
                board += 'X';
                ++index;
            }
            continue;
        }
        let g = "abcdefghijklmnopqrstuvwxyz".indexOf(ch);
        if (g >= 0) {
            for (let _i = 0; _i <= g; ++_i) {
                board += 'O';
                ++index;
            }
            continue;
        }
    }

    if (board.length < 64) return "too short for short RFEN.";

    if (turn == 'b') {
        return board + " X";
    } else {
        return board + " O";
    }
}

function readobf2rfen(line) {
    if (line.length < 66) return "too short for obf.";

    let turn;
    let ch = line[65];
    if (ch == 'O' || ch == 'X' || ch == 'o' || ch == 'x') {
        turn = ch.toUpperCase();
    } else {
        return ("[" + ch + "] is invalid....");
    }
    let ABC=" ABCDEFGH";
    let abc = " abcdefgh"
    let rfen = new Array(8);
    for (y = 0; y < 8; ++y) {
        let txt = "";
        let ch = line[y * 8].toUpperCase();
        if (ch != 'O' && ch != 'X' && ch != '-') {
            return ("[" + ch + "] is invalid @(1," + (y + 1) + ")....");
        }

        let n = 1;
        for (x = 1; x < 8; ++x) {
            let ch2 = line[y * 8 + x].toUpperCase();
            if (ch2 != 'O' && ch2 != 'X' && ch2 != '-') {
                return ("[" + ch + "] is invalid @("
                    + (x + 1) + "," + (y + 1) + ")....");
            }

            if (ch == ch2) {
                ++n;
                continue;
            }

            if (ch == '-') {
                txt += n;
            } else if (ch == 'X') {
                txt += ABC[n];
            } else {  // 'O'
                txt += abc[n];
            }
            ch = ch2;
            n = 1;
        }
        if (ch == '-') {
            txt += n;
        } else if (ch == 'X') {
            txt += ABC[n];
        } else {  // 'O'
            txt += abc[n];
        }

        rfen[y] = txt;
    }

    if (turn == 'X') {
        return rfen.join('/') + " b";
    } else {
        return rfen.join('/') + " w";
    }
}

function readobf2shortrfen(line) {
    if (line.length < 66) return "too short for obf.";

    let turn = line[65].toUpperCase();
    if (turn != 'O' && turn != 'X') {
        return ("[" + turn + "] is invalid as turn....");
    }

    let ABC=" ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    let abc = " abcdefghijklmnopqrstuvwxyz";
    let rfen = "";
    let old = line[0].toUpperCase();
    if (old != 'O' && old != 'X' && old != '-') {
        return ("[" + old + "] is invalid @1....");
    }
    let n = 1;
    for (xy = 1; xy < 64; ++xy) {
        let ch = line[xy].toUpperCase();
        if (ch != 'O' && ch != 'X' && ch != '-') {
            return ("[" + ch + "] is invalid @" + (xy + 1) + "....");
        }

        if (ch == old) {
            ++n;
            if (old == '-' && n > 8) {
                rfen += "8";
                n = 1;
            }
            if (n > 26) {
                if (ch == 'X') {
                    rfen += "Z";
                } else {  // 'O'
                    rfen += "z";
                }
                n = 1;
            }
            continue;
        }

        if (old == '-') {
            rfen += n;
        } else if (old == 'X') {
            rfen += ABC[n];
        } else {  // 'O'
            rfen += abc[n];
        }

        old = ch;
        n = 1;
    }

    if (old == '-') {
        rfen += n;
    } else if (old == 'X') {
        rfen += ABC[n];
    } else {  // 'O'
        rfen += abc[n];
    }

    if (turn == 'X') {
        return rfen + " b";
    } else {
        return rfen + " w";
    }
}

function checkfmt(line) {
    if (line.length == 0) return FMT_NONE;

    let ch = line.at(-1);
    if (ch == 'o' || ch == 'x' || ch == 'O' || ch == 'X')
        return FMT_OBF;

    if (line.includes('/')) return FMT_RFEN;

    return FMT_SHORT_RFEN;
}

function cnvt(line) {
    if (line.length == 0) return "-";

    let fmt = checkfmt(line);
    if (fmt == FMT_OBF) return readobf2rfen(line) + ", " + readobf2shortrfen(line);

    if (fmt == FMT_SHORT_RFEN) return readshortrfen(line);

    return readrfen(line);
}

function read(lines) {
    let ret = lines .map((line) => cnvt(line)).join('<br>');
    return ret;
}

function run() {
  let txt = document.getElementById('input').value.split('\n');
  // console.log(txt);
  let out = document.getElementById('output');
  out.innerHTML = read(txt);
}

function genboard(board, turn) {
    let ret = "<table border='1' bgcolor='darkgreen' cellspacing='0'>";
    for (y = 0; y < 8; ++y) {
        let txt = "<tr>";
        for (x = 0; x < 8; ++x) {
            txt += "<td width='20'>";
            if (board[x + y * 8] == 'X') {
                txt += "<span style='color:black;'>●</span>";
            } else if (board[x + y * 8] == 'O') {
                txt += "<span style='color:white;'>●</span>";
            } else {
                txt += "&nbsp;";
            }
            txt += "</td>";
        }
        ret += txt + "</tr>";
    }
    if (turn == 'X' || turn == 'b') {
        return ret + "<caption>black's turn.</caption></table>";
    } else {
        return ret + "<caption>white's turn.</caption></table>";
    }
}

function readobf2d(line) {
    let board = new Array(64);
    for (y = 0; y < 8; ++y) {
        for (x = 0; x < 8; ++x) {
            let ch = line[y * 8 + x];
            if (ch == '-' || ch == 'o' || ch == 'x'
                    || ch == 'O' || ch == 'X') {
                board[y * 8 + x] = ch.toUpperCase();
                continue;
            }

            return ("[" + ch + "] is invalid...");
        }
    }
    let turn;
    let ch = line[65];
    if (ch == 'O' || ch == 'X' || ch == 'o' || ch == 'x') {
        turn = ch.toUpperCase();
    } else {
        return ("[" + ch + "] is invalid....");
    }

    return genboard(board, turn);
}

function cvt22d(txt) {
    if (txt.length == 0) return "-";

    let fmt = checkfmt(txt);
    if (fmt == FMT_OBF) return readobf2d(txt);

    if (fmt == FMT_RFEN) return readrfen2d(txt);

    return readshortrfen2d(txt);
}

function to2d() {
  let txt = document.getElementById('fmt').value;
  // console.log(txt);
  let out = document.getElementById('output2d');
  out.innerHTML = cvt22d(txt);
}
</script>
